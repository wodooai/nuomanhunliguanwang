server {
    listen 80;
    server_name nuomanhunli.cn www.nuomanhunli.cn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://nuomanhunli.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name nuomanhunli.cn;
    ssl_certificate /etc/letsencrypt/live/nuomanhunli.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuomanhunli.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:4188;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    client_max_body_size 16m;
}
